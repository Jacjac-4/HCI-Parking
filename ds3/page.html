<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{browser_title} | Parking 4 UNH</title>
  <link rel="stylesheet" href="/ds3/styles.css">
  <script type="module" src="/ds3/portal.js"></script>
</head>
<body data-page="{page}">
<!-- Popup shared by every page using this template -->
<dialog id="parking-help-dialog" aria-labelledby="parking-help-title">
  <h2 id="parking-help-title">Parking Help</h2>
  <p>What do you need help with?</p>
  <p>
    Get help with permit applications, application status,
    covered lots, and parking tickets.
  </p>
  <form method="dialog">
    <button type="submit" autofocus>Close</button>
  </form>
</dialog>
  <a class="skip" href="#main">Skip to main content</a>
  <header class="masthead"><div class="wrap brand">
    <img class="unh-logo" src="/ds3-assets/branding/unh-logo.svg" alt="University of New Hampshire" width="400" height="95">
    {brand}
  </div></header>
  <div class="nav-bar"><nav class="wrap" aria-label="Main navigation">{navigation}
  </nav></div>
  <main class="wrap" id="main" tabindex="-1">
    <h1>{title}</h1>
    {intro}
    <p id="status" role="status"></p>
    <div id="content"></div>
  </main>
  <footer class="wrap portal-footer">
    <a href="/ds3/lots">Covered lots and maps</a>
  </footer>
  <a class="help-launcher button-link primary" href="/ds3/help" aria-haspopup="dialog">Parking Help</a>
</body>
</html>
